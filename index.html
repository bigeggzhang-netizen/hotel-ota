<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>OTA 盯盘台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: status header, scrollable tab strip, one work column; decisions as cards, grids as tables */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#17202b; --muted:#5b6676; --line:#dce1e7;
  --accent:#1d5b86; --accent-ink:#ffffff; --accent-soft:#e2edf6; --brass:#9a6f22;
  --crit:#b3362a; --crit-soft:#fbe8e5; --warn:#a86300; --warn-soft:#fcefd8; --good:#2b7a4b; --good-soft:#e1f2e7;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --ink:#e6ebf1; --muted:#9aa6b5; --line:#2a3442;
  --accent:#6fb0de; --accent-ink:#0c1622; --accent-soft:#1c3247; --brass:#d3a95a;
  --crit:#f07b6c; --crit-soft:#3a1d1a; --warn:#f0b257; --warn-soft:#382a14; --good:#6cc794; --good-soft:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --ink:#e6ebf1; --muted:#9aa6b5; --line:#2a3442;
  --accent:#6fb0de; --accent-ink:#0c1622; --accent-soft:#1c3247; --brass:#d3a95a;
  --crit:#f07b6c; --crit-soft:#3a1d1a; --warn:#f0b257; --warn-soft:#382a14; --good:#6cc794; --good-soft:#16301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12.5px}
.mockbar{background:var(--warn-soft);color:var(--warn);font-size:12.5px}
.mockbar .wrap{padding-block:6px}
.hdr-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--crit)}
button.small{padding:3px 9px;font-size:12.5px}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:11px 12px;white-space:nowrap;color:var(--muted);background:none}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h2{font-size:16px;margin:0;text-wrap:balance}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head p{margin:0;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:12px}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--crit)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.dot.mock{background:var(--warn)}
.lvl{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;letter-spacing:.04em}
.lvl.urgent{background:var(--crit-soft);color:var(--crit)}
.lvl.important{background:var(--warn-soft);color:var(--warn)}
.lvl.normal{background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;border-left:4px solid var(--line)}
.card.urgent{border-left-color:var(--crit)}
.card.important{border-left-color:var(--warn)}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .meta .due{margin-left:auto;font-variant-numeric:tabular-nums}
.card .meta .due.late{color:var(--crit);font-weight:600}
.card h3{margin:0;font-size:14.5px;line-height:1.4}
.delta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.delta .b{color:var(--muted);text-decoration:line-through}
.delta .a{font-weight:700;color:var(--accent)}
.reason{margin:0;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stage{font-size:12.5px;color:var(--accent)}
.stage.done{color:var(--good)}
.stage.bad{color:var(--crit)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
thead th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg)}
tr:last-child td{border-bottom:0}
.cal td,.cal thead th{text-align:center;white-space:nowrap;min-width:64px;font-size:12px}
.cal th[scope="row"]{white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.cal tr.rt th,.cal tr.rt td{background:var(--accent-soft);font-weight:600}
.cal tr.rt th small,.cal td small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cal th.sub{font-weight:400;color:var(--muted);padding-left:20px}
.cal td.off{color:var(--muted)}
td.bad{background:var(--crit-soft);color:var(--crit);font-weight:600}
td.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.row-actions{white-space:nowrap}
.status{font-size:12px;color:var(--muted)}
.status.ok{color:var(--good)}
.status.open{color:var(--crit);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.grid2>section{display:flex;flex-direction:column;gap:10px;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:80px;resize:vertical}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0;font-size:16px}
.modal dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
.modal dt{color:var(--muted)}
.modal dd{margin:0;font-variant-numeric:tabular-nums}
.modal .err{color:var(--crit);font-size:12.5px;min-height:1em;margin:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice p{margin:0;min-width:0;flex:1 1 260px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><b>OTA 盯盘台</b><span>示例酒店 · 选住云管家 + 携程 / 美团 / 飞猪</span></div>
  <div class="hdr-right">
    <span class="clock" id="clock"></span>
    <span class="clock" id="lastScan"></span>
    <button class="primary" id="scanBtn">模拟一次巡检</button>
  </div>
</div></header>
<div class="mockbar"><div class="wrap">框架演示：所有房态、价格、订单、点评均为模拟数据，未连接选住云管家或任何 OTA，操作不会影响真实房态。</div></div>
<nav class="tabs" aria-label="功能"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="view"></div></main>
<div id="modalRoot"></div>

<script>
/* ================= 基础数据（模拟） ================= */
const CH=[{id:'ctrip',name:'携程'},{id:'meituan',name:'美团'},{id:'fliggy',name:'飞猪'}];
const RT=[
  {id:'K',name:'高级大床房',total:30,base:398,floor:328,cap:688},
  {id:'T',name:'高级双床房',total:25,base:418,floor:338,cap:698},
  {id:'D',name:'豪华大床房',total:15,base:528,floor:438,cap:888},
  {id:'S',name:'行政套房',total:6,base:888,floor:728,cap:1588}];
const DAYS=14;
const thr={spreadPct:3,spreadAbs:10,reopenMin:3,compPct:10,urgentMin:10,importantMin:60,autoCloseMin:20,autoClose:true,orderMin:10};
let seed=20261027;
function rnd(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const today=new Date();today.setHours(0,0,0,0);
const WK='日一二三四五六';
function dayDate(i){const d=new Date(today);d.setDate(d.getDate()+i);return d;}
function dayLabel(i){const d=dayDate(i);return i===0?`今天 ${d.getMonth()+1}/${d.getDate()}`:`${d.getMonth()+1}/${d.getDate()} 周${WK[d.getDay()]}`;}
function isWeekend(i){const g=dayDate(i).getDay();return g===5||g===6;}
function price8(x){return Math.round(x/10)*10-2;}
function rtOf(id){return RT.find(r=>r.id===id);}
function chName(id){return CH.find(c=>c.id===id).name;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hhmm(d){return d.toTimeString().slice(0,5);}

/* 模拟库存：inv[房型][天] = {pms 可售, ch:{渠道:{open,qty,price}}} */
const inv={};
RT.forEach(rt=>{inv[rt.id]=[];for(let i=0;i<DAYS;i++){
  const occ=0.45+rnd()*0.35+(isWeekend(i)?0.12:0)-(i>7?0.15:0);
  const pms=Math.max(0,Math.round(rt.total*(1-Math.min(occ,0.98))));
  const p=price8(rt.base*(isWeekend(i)?1.15:1));
  const ch={};CH.forEach(c=>{const q=Math.min(pms,c.id==='ctrip'?5:3);ch[c.id]={open:q>0,qty:q,price:p};});
  inv[rt.id].push({pms,ch});}});
// 注入几种典型异常，便于演示
(function(){
  const k=inv.K[0];k.pms=1;k.ch.ctrip={...k.ch.ctrip,open:true,qty:3};k.ch.meituan={...k.ch.meituan,open:true,qty:1};k.ch.fliggy={...k.ch.fliggy,open:true,qty:1};
  const t=inv.T[2];t.pms=Math.max(t.pms,9);t.ch.ctrip={...t.ch.ctrip,open:true,qty:5};t.ch.meituan={...t.ch.meituan,open:true,qty:3};t.ch.fliggy={...t.ch.fliggy,open:false,qty:0};
  const d=inv.D[0];d.pms=Math.max(d.pms,4);CH.forEach(c=>{d.ch[c.id]={...d.ch[c.id],open:true,qty:Math.min(d.pms,3)};});d.ch.meituan.price=199;
  const k5=inv.K[5];k5.pms=Math.max(k5.pms,6);CH.forEach(c=>{k5.ch[c.id]={...k5.ch[c.id],open:true,qty:3};});k5.ch.fliggy.price=k5.ch.ctrip.price+40;
  const s=inv.S[0];s.pms=0;CH.forEach(c=>{s.ch[c.id]={...s.ch[c.id],open:false,qty:0};});
})();

const comps=[
  {name:'竞对 A · 同街精品酒店',dist:0.4,y:428,t:428,full:false},
  {name:'竞对 B · 连锁中高端',dist:0.9,y:388,t:448,full:false},
  {name:'竞对 C · 商务酒店',dist:1.2,y:358,t:358,full:false},
  {name:'竞对 D · 设计酒店',dist:1.8,y:468,t:468,full:true},
  {name:'竞对 E · 连锁经济型',dist:2.3,y:338,t:328,full:false},
  {name:'竞对 F · 高端品牌',dist:2.9,y:518,t:518,full:false}];

const orders=[
  {no:'CT26102700187',ch:'携程',rt:'高级大床房',guest:'王**',stay:'今晚 1 晚',amt:398,status:'待确认',mins:12},
  {no:'MT26102700342',ch:'美团',rt:'高级双床房',guest:'李**',stay:'今晚 2 晚',amt:836,status:'已确认',mins:35},
  {no:'FZ26102700051',ch:'飞猪',rt:'豪华大床房',guest:'陈**',stay:'明晚 1 晚',amt:528,status:'待确认',mins:4},
  {no:'CT26102600954',ch:'携程',rt:'行政套房',guest:'赵**',stay:'今晚 1 晚',amt:888,status:'已取消',mins:80},
  {no:'MT26102700310',ch:'美团',rt:'高级大床房',guest:'周**',stay:'今晚 1 晚',amt:398,status:'未同步到 PMS',mins:18}];
const reviews=[
  {id:1,ch:'美团',score:2,text:'卫生间有异味，晚上前台处理很慢。',time:'今天 07:42',status:'open',draft:''},
  {id:2,ch:'携程',score:5,text:'位置方便，早餐不错，前台小姐姐很热情。',time:'今天 06:15',status:'open',draft:''},
  {id:3,ch:'飞猪',score:3,text:'房间干净，但隔音一般，能听到走廊声音。',time:'昨天 22:30',status:'open',draft:''}];

/* ================= 数据适配器（以后在这里换成真实接口） ================= */
const adapters={
  pms:{name:'选住云管家',use:'可售房、在住、维修房、PMS 订单',mode:'模拟数据',api:'getAvailability(房型, 日期)',
       getAvailability:(rt,di)=>inv[rt][di].pms},
  ota:{name:'携程 / 美团 / 飞猪',use:'房态房价读写、订单、点评',mode:'模拟数据',api:'read(渠道) · push(渠道, 房型, 日期, 变更)',
       read:(ch,rt,di)=>inv[rt][di].ch[ch],
       push:(ch,rt,di,patch)=>{Object.assign(inv[rt][di].ch[ch],patch);return {ok:true};}},
  comp:{name:'竞对价格服务',use:'竞对公开价、满房状态',mode:'模拟数据',api:'getRates(竞对列表)'},
  notify:{name:'通知通道',use:'电话、企业微信、短信',mode:'演示：页面内提示',api:'send(级别, 内容, 接收人)'}};

/* ================= 状态 ================= */
let sugs=[],alerts=[],logs=[],sidN=0,aidN=0,lidN=0,scanN=0,lastScan=null;
let tab='overview';
try{const t=localStorage.getItem('ota-tab');if(t)tab=t;}catch(e){}
const KIND={close:'关房',reduce:'减房量',open:'开房',price:'调价'};
const LVL={urgent:'紧急',important:'重要',normal:'提示'};

function addSug(o){
  // 同一问题不重复推送：未处理、已驳回、已作废的不再提；已执行的只在问题再次出现时重新提醒
  if(sugs.some(s=>s.key===o.key&&((s.status!=='done'&&s.status!=='failed')||o.key.startsWith('comp-'))))return false;
  const s=Object.assign({id:'S'+(++sidN),created:new Date(),status:'pending'},o);
  sugs.unshift(s);
  addAlert(o.level,o.title,s.id);
  return true;
}
function addAlert(level,text,sid,time){alerts.unshift({id:'A'+(++aidN),level,text,sid:sid||null,time:time||new Date(),status:'open'});}

/* ================= 监控规则（建议引擎） ================= */
function detect(){
  let n=0;
  RT.forEach(rt=>{for(let di=0;di<DAYS;di++){
    const pms=adapters.pms.getAvailability(rt.id,di);
    const ref=adapters.ota.read('ctrip',rt.id,di);
    CH.forEach(c=>{
      const s=adapters.ota.read(c.id,rt.id,di);
      const where=`${rt.name} ${dayLabel(di)} · ${c.name}`;
      if(s.open&&s.qty>pms){
        const close=pms===0;
        n+=addSug({key:`over-${rt.id}-${di}-${c.id}`,level:'urgent',kind:close?'close':'reduce',rt:rt.id,di,chs:[c.id],
          title:`${where} 有超售风险`,patch:close?{open:false,qty:0}:{qty:pms},
          before:`在售 ${s.qty} 间`,after:close?'关房':`在售 ${pms} 间`,editable:close?null:'qty',
          reason:`选住云管家可售 ${pms} 间，${c.name}在售 ${s.qty} 间。`})?1:0;
      }
      if(!s.open&&pms>=thr.reopenMin){
        const q=Math.min(pms,3);
        n+=addSug({key:`reopen-${rt.id}-${di}-${c.id}`,level:'important',kind:'open',rt:rt.id,di,chs:[c.id],
          title:`${where} 有空房但处于关房`,patch:{open:true,qty:q},before:'关房',after:`开房 · ${q} 间`,editable:'qty',
          reason:`选住云管家可售 ${pms} 间，${c.name}未开房，可能错失订单。`})?1:0;
      }
      if(s.open&&(s.price<rt.floor||s.price>rt.cap)){
        const to=ref&&c.id!=='ctrip'&&ref.price>=rt.floor&&ref.price<=rt.cap?ref.price:price8(rt.base*(isWeekend(di)?1.15:1));
        n+=addSug({key:`abn-${rt.id}-${di}-${c.id}-${s.price}`,level:'urgent',kind:'price',rt:rt.id,di,chs:[c.id],
          title:`${where} 价格异常 ¥${s.price}`,patch:{price:to},before:`¥${s.price}`,after:`¥${to}`,editable:'price',
          reason:s.price<rt.floor?`低于底价 ¥${rt.floor}，疑似误操作。`:`高于封顶价 ¥${rt.cap}，疑似误操作。`})?1:0;
      } else if(s.open&&c.id!=='ctrip'&&ref.open){
        const diff=s.price-ref.price;
        if(Math.abs(diff)/ref.price*100>thr.spreadPct&&Math.abs(diff)>thr.spreadAbs){
          n+=addSug({key:`spread-${rt.id}-${di}-${c.id}-${s.price}`,level:'important',kind:'price',rt:rt.id,di,chs:[c.id],
            title:`${where} 与携程价格不一致`,patch:{price:ref.price},before:`¥${s.price}`,after:`¥${ref.price}`,editable:'price',
            reason:`携程 ¥${ref.price}，${c.name} ¥${s.price}，相差 ${diff>0?'+':''}${diff} 元，可能被判价格倒挂。`})?1:0;
        }
      }
    });
  }});
  comps.forEach(cp=>{
    const pct=(cp.t-cp.y)/cp.y*100;
    if(pct>thr.compPct){
      const rt=RT[0],cur=adapters.ota.read('ctrip',rt.id,0).price,to=Math.min(rt.cap,price8(cur*1.06));
      if(to>cur){
        n+=addSug({key:`comp-${cp.name}-${cp.t}`,level:'important',kind:'price',rt:rt.id,di:0,chs:CH.map(c=>c.id).filter(id=>adapters.ota.read(id,rt.id,0).open),
          title:`${cp.name} 今日上调 ${pct.toFixed(0)}%`,patch:{price:to},before:`¥${cur}`,after:`¥${to}`,editable:'price',
          reason:`竞对由 ¥${cp.y} 调到 ¥${cp.t}。建议${rt.name}今日全部已开渠道上调约 6%。`})?1:0;
      }
    }
  });
  lastScan=new Date();
  return n;
}

/* 模拟巡检：轮流制造一种新情况 */
function perturb(){
  const step=scanN++%3, di=1+Math.floor(rnd()*5), rt=RT[Math.floor(rnd()*3)];
  const cell=inv[rt.id][di];
  if(step===0){const c=cell.ch.meituan;if(!c.open){c.open=true;c.qty=Math.min(cell.pms,2)||1;}c.price=cell.ch.ctrip.price+60;}
  else if(step===1){const c=cell.ch.ctrip;c.open=true;c.qty=Math.max(c.qty,3);cell.pms=Math.max(0,c.qty-2);}
  else{const cp=comps[2];cp.y=cp.t;cp.t=price8(cp.t*1.14);}
}

/* ================= 执行（确认后才调用） ================= */
function snapshot(s){const o={};s.chs.forEach(id=>{o[id]={...inv[s.rt][s.di].ch[id]};});return o;}
function targetText(s){return `${rtOf(s.rt).name} · ${dayLabel(s.di)} · ${s.chs.map(chName).join('、')}`;}
function execute(s,actor){
  s.status='writing';s.stage=`正在写入${s.chs.map(chName).join('、')}…`;render();
  setTimeout(()=>{
    const snap=snapshot(s);
    const results=s.chs.map(id=>adapters.ota.push(id,s.rt,s.di,s.patch));
    s.stage='回读核对中…';render();
    setTimeout(()=>{
      const ok=results.every(r=>r.ok)&&s.chs.every(id=>Object.keys(s.patch).every(k=>adapters.ota.read(id,s.rt,s.di)[k]===s.patch[k]));
      s.status=ok?'done':'failed';s.doneAt=new Date();
      logs.unshift({id:'L'+(++lidN),time:new Date(),actor,action:KIND[s.kind],target:targetText(s),before:s.before,after:s.after,result:ok?'成功，回读一致':'失败，已告警',snap,rt:s.rt,di:s.di,rolledBack:false});
      alerts.forEach(a=>{if(a.sid===s.id&&a.status==='open')a.status='done';});
      if(!ok)addAlert('urgent',`写入失败：${targetText(s)}`);
      toast(ok?'已写入渠道，回读核对一致':'回读不一致，已发紧急告警');
      render();
    },700);
  },900);
}
function rollback(l){
  Object.keys(l.snap).forEach(id=>adapters.ota.push(id,l.rt,l.di,l.snap[id]));
  l.rolledBack=true;
  logs.unshift({id:'L'+(++lidN),time:new Date(),actor:'管理者（演示）',action:'回滚',target:l.target,before:l.after,after:l.before,result:'成功，已恢复调整前的值',snap:null,rolledBack:true});
  toast('已回滚到调整前的值');render();
}

/* ================= 定时：倒计时、升级、紧急关房 ================= */
function minsSince(d){return (Date.now()-d.getTime())/60000;}
function tick(){
  sugs.forEach(s=>{
    if(s.status!=='pending')return;
    const m=minsSince(s.created), lim=s.level==='urgent'?thr.urgentMin:thr.importantMin;
    if(m>lim&&!s.escalated){s.escalated=true;addAlert(s.level,`已升级代理审批人：${s.title}`,s.id);}
    if(s.level==='urgent'&&(s.kind==='close'||s.kind==='reduce')&&thr.autoClose&&m>thr.autoCloseMin){
      s.patch={open:false,qty:0};s.after='关房';s.kind='close';execute(s,'系统 · 紧急关房');
    }
    if(s.level==='important'&&m>240){s.status='expired';}
  });
  render(true);
}

/* ================= 确认弹窗 ================= */
let modalOpen=false;
function closeModal(){modalOpen=false;document.getElementById('modalRoot').innerHTML='';render();}
function openModal(mode,s,l){
  modalOpen=true;
  const needPin=mode!=='reject';
  const title={confirm:'确认执行',edit:'修改后确认',reject:'驳回建议',rollback:'确认回滚'}[mode];
  let body='';
  if(mode==='rollback')body=`<dl><dt>对象</dt><dd>${esc(l.target)}</dd><dt>当前</dt><dd>${esc(l.after)}</dd><dt>恢复为</dt><dd><b>${esc(l.before)}</b></dd></dl>`;
  else{
    body=`<dl><dt>对象</dt><dd>${esc(targetText(s))}</dd><dt>动作</dt><dd>${KIND[s.kind]}</dd><dt>调整前</dt><dd>${esc(s.before)}</dd><dt>调整后</dt><dd>${mode==='edit'?`<input id="m-val" type="number" value="${s.patch[s.editable]}" aria-label="新数值"> ${s.editable==='price'?'元':'间'}`:`<b>${esc(s.after)}</b>`}</dd><dt>原因</dt><dd>${esc(s.reason)}</dd></dl>`;
    if(mode==='edit')body+=s.editable==='price'?`<p class="note">允许范围 ¥${rtOf(s.rt).floor} – ¥${rtOf(s.rt).cap}</p>`:`<p class="note">不能超过选住云管家可售 ${adapters.pms.getAvailability(s.rt,s.di)} 间</p>`;
    if(mode==='reject')body+=`<label class="note" for="m-reason">驳回原因<select id="m-reason"><option>判断不同，不需要调整</option><option>已在 OTA 后台手动处理</option><option>数据有误</option><option>其他</option></select></label>`;
  }
  if(needPin)body+=`<label class="note" for="m-pin">二次验证口令（演示口令 1234）<input id="m-pin" type="password" inputmode="numeric" autocomplete="off"></label>`;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" data-act="m-cancel"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}">
    <h3>${title}</h3>${body}<p class="err" id="m-err"></p>
    <div class="actions" style="justify-content:flex-end"><button data-act="m-cancel">取消</button><button class="${mode==='reject'?'danger':'primary'}" id="m-ok">${mode==='reject'?'驳回':mode==='rollback'?'回滚':'确认执行'}</button></div></div></div>`;
  const first=document.getElementById(mode==='edit'?'m-val':needPin?'m-pin':'m-reason');first&&first.focus();
  document.getElementById('m-ok').onclick=()=>{
    const err=document.getElementById('m-err');
    if(needPin&&document.getElementById('m-pin').value!=='1234'){err.textContent='口令不正确。演示口令是 1234。';return;}
    if(mode==='rollback'){closeModal();rollback(l);return;}
    if(mode==='reject'){s.status='rejected';s.rejectReason=document.getElementById('m-reason').value;
      logs.unshift({id:'L'+(++lidN),time:new Date(),actor:'管理者（演示）',action:'驳回',target:targetText(s),before:s.before,after:'未执行',result:s.rejectReason,snap:null,rolledBack:false});
      alerts.forEach(a=>{if(a.sid===s.id&&a.status==='open')a.status='done';});closeModal();toast('已驳回，渠道未做任何改动');return;}
    if(mode==='edit'){
      const v=Math.round(Number(document.getElementById('m-val').value)), rt=rtOf(s.rt);
      if(s.editable==='price'&&(v<rt.floor||v>rt.cap)){err.textContent=`价格需在 ¥${rt.floor} 到 ¥${rt.cap} 之间。`;return;}
      if(s.editable==='qty'){const max=adapters.pms.getAvailability(s.rt,s.di);if(!(v>=0&&v<=max)){err.textContent=`房量需在 0 到 ${max} 间之间。`;return;}}
      s.patch={...s.patch,[s.editable]:v};
      s.after=s.editable==='price'?`¥${v}`:s.kind==='open'?`开房 · ${v} 间`:`在售 ${v} 间`;
    }
    closeModal();execute(s,'管理者（演示）');
  };
}

/* ================= 事件 ================= */
let toastT;
function toast(msg){clearTimeout(toastT);let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=msg;t.hidden=false;toastT=setTimeout(()=>{t.hidden=true;},2600);}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;try{localStorage.setItem('ota-tab',tab);}catch(err){}render();window.scrollTo(0,0);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act, id=el.dataset.id, s=sugs.find(x=>x.id===id);
  if(act==='m-cancel'){if(e.target===el)closeModal();return;}
  if(act==='confirm'||act==='edit'||act==='reject')openModal(act,s);
  else if(act==='rollback')openModal('rollback',null,logs.find(l=>l.id===id));
  else if(act==='ack'||act==='ignore'){const a=alerts.find(x=>x.id===id);a.status=act==='ack'?'done':'ignored';render();}
  else if(act==='goto-log'){tab='log';render();}
  else if(act==='goto-queue'){tab='queue';render();}
  else if(act==='order'){orders[Number(el.dataset.i)].status='已处理';render();}
  else if(act==='rv-draft'){const r=reviews.find(x=>x.id===Number(id));
    r.draft=r.score<=3?`您好，非常抱歉这次入住给您带来不好的体验。关于您提到的“${r.text.slice(0,12)}…”，我们已安排相关部门检查整改。欢迎您再次入住，届时请联系前台，我们会为您做好安排。`:`感谢您的好评！很高兴您喜欢我们的服务，期待您再次光临。`;render();}
  else if(act==='rv-send'){const r=reviews.find(x=>x.id===Number(id));r.draft=document.getElementById('draft-'+id).value;r.status='done';toast('回复已标记发出（演示，未连接 OTA）');render();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='priceDay'){priceDay=Number(t.value);render();}
  else if(t.dataset.thr){thr[t.dataset.thr]=Number(t.value);}
  else if(t.id==='t-autoClose'){thr.autoClose=t.checked;}
  else if(t.dataset.rt){rtOf(t.dataset.rt)[t.dataset.f]=Number(t.value);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeModal();});
document.getElementById('scanBtn').onclick=()=>{perturb();const n=detect();render();toast(n?`巡检完成，新增 ${n} 条建议`:'巡检完成，未发现新问题');};
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}

detect();render();clock();
setInterval(clock,1000);
setInterval(tick,30000);
setInterval(()=>{const n=detect();if(n){render(true);toast(`自动巡检发现 ${n} 条新建议`);}},5*60000);
</script>

</html>
