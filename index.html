<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>OTA 盯盘台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: status header, scrollable tab strip, one work column; decisions as cards, grids as tables */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#17202b; --muted:#5b6676; --line:#dce1e7;
  --accent:#1d5b86; --accent-ink:#ffffff; --accent-soft:#e2edf6; --brass:#9a6f22;
  --crit:#b3362a; --crit-soft:#fbe8e5; --warn:#a86300; --warn-soft:#fcefd8; --good:#2b7a4b; --good-soft:#e1f2e7;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --ink:#e6ebf1; --muted:#9aa6b5; --line:#2a3442;
  --accent:#6fb0de; --accent-ink:#0c1622; --accent-soft:#1c3247; --brass:#d3a95a;
  --crit:#f07b6c; --crit-soft:#3a1d1a; --warn:#f0b257; --warn-soft:#382a14; --good:#6cc794; --good-soft:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --ink:#e6ebf1; --muted:#9aa6b5; --line:#2a3442;
  --accent:#6fb0de; --accent-ink:#0c1622; --accent-soft:#1c3247; --brass:#d3a95a;
  --crit:#f07b6c; --crit-soft:#3a1d1a; --warn:#f0b257; --warn-soft:#382a14; --good:#6cc794; --good-soft:#16301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12.5px}
.mockbar{background:var(--warn-soft);color:var(--warn);font-size:12.5px}
.mockbar .wrap{padding-block:6px}
.hdr-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--crit)}
button.small{padding:3px 9px;font-size:12.5px}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:11px 12px;white-space:nowrap;color:var(--muted);background:none}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h2{font-size:16px;margin:0;text-wrap:balance}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head p{margin:0;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:12px}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--crit)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.dot.mock{background:var(--warn)}
.lvl{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;letter-spacing:.04em}
.lvl.urgent{background:var(--crit-soft);color:var(--crit)}
.lvl.important{background:var(--warn-soft);color:var(--warn)}
.lvl.normal{background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;border-left:4px solid var(--line)}
.card.urgent{border-left-color:var(--crit)}
.card.important{border-left-color:var(--warn)}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .meta .due{margin-left:auto;font-variant-numeric:tabular-nums}
.card .meta .due.late{color:var(--crit);font-weight:600}
.card h3{margin:0;font-size:14.5px;line-height:1.4}
.delta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.delta .b{color:var(--muted);text-decoration:line-through}
.delta .a{font-weight:700;color:var(--accent)}
.reason{margin:0;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stage{font-size:12.5px;color:var(--accent)}
.stage.done{color:var(--good)}
.stage.bad{color:var(--crit)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
thead th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg)}
tr:last-child td{border-bottom:0}
.cal td,.cal thead th{text-align:center;white-space:nowrap;min-width:64px;font-size:12px}
.cal th[scope="row"]{white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.cal tr.rt th,.cal tr.rt td{background:var(--accent-soft);font-weight:600}
.cal tr.rt th small,.cal td small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cal th.sub{font-weight:400;color:var(--muted);padding-left:20px}
.cal td.off{color:var(--muted)}
td.bad{background:var(--crit-soft);color:var(--crit);font-weight:600}
td.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.row-actions{white-space:nowrap}
.status{font-size:12px;color:var(--muted)}
.status.ok{color:var(--good)}
.status.open{color:var(--crit);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.grid2>section{display:flex;flex-direction:column;gap:10px;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:80px;resize:vertical}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0;font-size:16px}
.modal dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
.modal dt{color:var(--muted)}
.modal dd{margin:0;font-variant-numeric:tabular-nums}
.modal .err{color:var(--crit);font-size:12.5px;min-height:1em;margin:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice p{margin:0;min-width:0;flex:1 1 260px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.role{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;margin-left:4px;background:var(--accent-soft);color:var(--accent)}
.role.admin{background:var(--warn-soft);color:var(--brass)}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.authbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.authbox h1{margin:0;font-size:20px}
.authbox label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.authbox .err{color:var(--crit);font-size:12.5px;min-height:1em;margin:0}
.authbox .actions{justify-content:flex-end}
.temp{font-family:var(--mono);font-size:20px;letter-spacing:.06em;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:10px;text-align:center;user-select:all}
button:disabled,input:disabled,select:disabled{opacity:.6;cursor:not-allowed}
</style>

<div id="auth" class="authwrap" hidden></div>
<div id="app" hidden>
<header class="top"><div class="wrap">
  <div class="brand"><b>OTA 盯盘台</b><span>示例酒店 · 选住云管家 + 携程 / 美团 / 飞猪</span></div>
  <div class="hdr-right">
    <span class="clock" id="clock"></span>
    <span class="clock" id="lastScan"></span>
    <button class="primary" id="scanBtn" hidden>模拟一次巡检</button>
    <span class="who" id="who"></span>
    <button class="small" id="pwBtn">修改密码</button>
    <button class="small" id="logoutBtn">退出</button>
  </div>
</div></header>
<div class="mockbar"><div class="wrap">账号、角色、二次验证和操作记录是真实功能；房态、价格、订单、点评仍是模拟数据，未连接选住云管家或任何 OTA。</div></div>
<nav class="tabs" aria-label="功能"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="view"></div></main>
</div>
<div id="modalRoot"></div>

<script>
/* ================= 状态 ================= */
let me=null,S=null,U=null,skew=0,priceDay=0,modalOpen=false;
let tab='overview';
try{const t=localStorage.getItem('ota-tab');if(t)tab=t;}catch(e){}
const KIND={close:'关房',reduce:'减房量',open:'开房',price:'调价'};
const LVL={urgent:'紧急',important:'重要',normal:'提示'};
const $=id=>document.getElementById(id);

function can(p){return !!me&&me.perms.includes(p);}
function now(){return Date.now()+skew;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hhmm(ms){return new Date(ms).toTimeString().slice(0,5);}
function fullTime(ms){return new Date(ms).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
const WK='日一二三四五六';
function dayDate(i){const [y,m,d]=S.base.split('-').map(Number);return new Date(y,m-1,d+i);}
function dayLabel(i){const d=dayDate(i);return i===0?`今天 ${d.getMonth()+1}/${d.getDate()}`:`${d.getMonth()+1}/${d.getDate()} 周${WK[d.getDay()]}`;}
function rtOf(id){return S.rt.find(r=>r.id===id);}
function chList(){return S.ch.map(([id,name])=>({id,name}));}
function chName(id){return S.ch.find(c=>c[0]===id)[1];}
function targetText(s){return `${rtOf(s.rt).name} · ${dayLabel(s.di)} · ${s.chs.map(chName).join('、')}`;}
function minsSince(ms){return (now()-ms)/60000;}

/* ================= 与后台通信 ================= */
async function api(path,body,opts={}){
  const init={credentials:'same-origin',headers:{}};
  if(body!==undefined){init.method='POST';init.headers['Content-Type']='application/json';init.body=JSON.stringify(body);}
  if(opts.poll)init.headers['X-Poll']='1';
  let r;
  try{r=await fetch('/api/'+path,init);}catch(e){throw new Error('连不上服务器，请检查网络');}
  let d={};try{d=await r.json();}catch(e){}
  if(r.status===401&&path!=='login'){me=null;showAuth('login',d.error);throw new Error(d.error||'请先登录');}
  if(r.status===403&&d.mustChange){me.mustChange=true;showAuth('change');throw new Error(d.error);}
  if(!r.ok)throw new Error(d.error||`请求失败（${r.status}）`);
  return d;
}
async function refresh(soft){
  S=await api('state',undefined,{poll:soft});
  skew=S.now-Date.now();
  render(soft);
}
async function act(path,body){
  try{const d=await api(path,body);toast(d.msg||'已完成');await refresh();return d;}
  catch(e){toast(e.message);return null;}
}

/* ================= 登录与修改密码 ================= */
function showAuth(mode,msg){
  modalOpen=false;$('modalRoot').innerHTML='';
  $('app').hidden=true;$('auth').hidden=false;
  if(mode==='login'){
    $('auth').innerHTML=`<form class="authbox" id="loginForm">
      <h1>OTA 盯盘台</h1><p class="note">请使用管理者分配给您的账号登录。</p>
      <label for="lg-u">用户名<input id="lg-u" autocomplete="username" autocapitalize="off" required></label>
      <label for="lg-p">密码<input id="lg-p" type="password" autocomplete="current-password" required></label>
      <p class="err" id="lg-err">${esc(msg&&msg!=='请先登录'?msg:'')}</p>
      <button class="primary" type="submit">登录</button></form>`;
    $('lg-u').focus();
  }else{
    const forced=me&&me.mustChange;
    $('auth').innerHTML=`<form class="authbox" id="pwForm">
      <h1>修改密码</h1>
      <p class="note">${forced?'这是您第一次登录（或密码刚被重置）。请把临时密码改成只有您自己知道的密码。':'修改后，您在其他设备上的登录会自动退出。'}</p>
      <label for="pw-o">${forced?'临时密码':'当前密码'}<input id="pw-o" type="password" autocomplete="current-password" required></label>
      <label for="pw-n">新密码（至少 8 位，建议字母加数字）<input id="pw-n" type="password" autocomplete="new-password" minlength="8" required></label>
      <label for="pw-n2">再输一次新密码<input id="pw-n2" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="err" id="pw-err"></p>
      <div class="actions">${forced?'<button type="button" id="pwLogout">退出</button>':'<button type="button" id="pwCancel">取消</button>'}<button class="primary" type="submit">保存新密码</button></div></form>`;
    $('pw-o').focus();
  }
}
async function startApp(){
  $('auth').hidden=true;$('app').hidden=false;
  $('who').innerHTML=`<b>${esc(me.name)}</b><span class="role ${me.role}">${esc(me.roleName)}</span>`;
  $('scanBtn').hidden=!can('scan');
  if(!tabs().some(t=>t[0]===tab))tab='overview';
  try{await refresh();if(tab==='users')loadUsers();}catch(e){toast(e.message);}
}
async function logout(){try{await api('logout',{});}catch(e){}me=null;S=null;U=null;showAuth('login');}

/* ================= 视图 ================= */
function tabs(){
  const t=[['overview','盯盘总览'],['queue','待确认'],['calendar','房态日历'],['price','价格与竞对'],['alerts','告警'],['orders','订单与点评']];
  if(can('log_all'))t.push(['log','操作记录']);else if(can('log_own'))t.push(['log','我的操作记录']);
  t.push(['settings','设置与数据源']);
  if(can('users'))t.push(['users','账号管理']);
  return t;
}
function pending(){return S.sugs.filter(s=>s.status==='pending');}
function renderTabs(){
  const pc=pending().length, ac=S.alerts.filter(a=>a.status==='open'&&a.level==='urgent').length;
  $('tabs').innerHTML=tabs().map(([id,n])=>{
    const b=id==='queue'&&pc?`<span class="badge">${pc}</span>`:id==='alerts'&&ac?`<span class="badge">${ac}</span>`:'';
    return `<button role="tab" aria-selected="${tab===id}" data-tab="${id}">${n}${b}</button>`;}).join('');
}
function card(s){
  const lim=s.level==='urgent'?S.thr.urgentMin:S.thr.importantMin, left=Math.ceil(lim-minsSince(s.created));
  let due='';
  if(s.status==='pending')due=s.escalated?`<span class="due late">已超时 · 已升级代理审批人</span>`:`<span class="due">剩 ${Math.max(left,0)} 分钟</span>`;
  let foot='';
  if(s.status==='pending')foot=can('confirm')
    ?`<div class="actions"><button class="primary" data-act="confirm" data-id="${s.id}">确认</button>${s.editable?`<button data-act="edit" data-id="${s.id}">修改后确认</button>`:''}<button class="danger" data-act="reject" data-id="${s.id}">驳回</button></div>`
    :`<div class="stage">等待管理者确认</div>`;
  else if(s.status==='done')foot=`<div class="stage done">已执行 ${hhmm(s.doneAt)} · ${esc(s.by)} · 回读一致</div>`;
  else if(s.status==='failed')foot=`<div class="stage bad">写入失败，已告警</div>`;
  else if(s.status==='rejected')foot=`<div class="stage">已驳回：${esc(s.rejectReason)} · ${esc(s.by)}</div>`;
  else if(s.status==='expired')foot=`<div class="stage">超时未处理，已作废</div>`;
  return `<article class="card ${s.level}">
    <div class="meta"><span class="lvl ${s.level}">${LVL[s.level]}</span><span>${KIND[s.kind]}</span><span>${hhmm(s.created)}</span>${due}</div>
    <h3>${esc(s.title)}</h3>
    <div class="delta"><span class="b">${esc(s.before)}</span><span aria-hidden="true">→</span><span class="a">${esc(s.after)}</span></div>
    <p class="reason">${esc(s.reason)}</p>${foot}</article>`;
}
function vOverview(){
  const p=pending(), urg=p.filter(s=>s.level==='urgent').length;
  const openA=S.alerts.filter(a=>a.status==='open').length;
  const sold=S.rt.reduce((a,r)=>a+(r.total-S.inv[r.id][0].pms),0), tot=S.rt.reduce((a,r)=>a+r.total,0);
  const adr=Math.round(S.rt.reduce((a,r)=>a+S.inv[r.id][0].ch.ctrip.price*(r.total-S.inv[r.id][0].pms),0)/Math.max(sold,1));
  const lastAuto=S.logs.find(l=>l.actor.startsWith('系统')&&l.canRollback&&l.action==='关房');
  return `
  ${lastAuto?`<div class="notice"><p><b>系统紧急关房 ${hhmm(lastAuto.time)}</b>：${esc(lastAuto.target)}。这是唯一会自动执行的操作，如判断有误可回滚。</p><button data-act="goto-log">查看并回滚</button></div>`:''}
  <div class="kpis">
    <div class="kpi ${urg?'alert':''}"><small>待确认建议</small><b>${p.length}</b><em>其中紧急 ${urg} 条</em></div>
    <div class="kpi"><small>未处理告警</small><b>${openA}</b><em>按级别分派值守人</em></div>

}
const PIN=`<label class="note" for="m-pin">二次验证：请再输入一次您的登录密码<input id="m-pin" type="password" autocomplete="current-password"></label>`;
function openModal(mode,s,l){
  const title={confirm:'确认执行',edit:'修改后确认',reject:'驳回建议',rollback:'确认回滚'}[mode];
  let body='';
  if(mode==='rollback')body=`<dl><dt>对象</dt><dd>${esc(l.target)}</dd><dt>当前</dt><dd>${esc(l.after)}</dd><dt>恢复为</dt><dd><b>${esc(l.before)}</b></dd></dl>`;
  else{
    body=`<dl><dt>对象</dt><dd>${esc(targetText(s))}</dd><dt>动作</dt><dd>${KIND[s.kind]}</dd><dt>调整前</dt><dd>${esc(s.before)}</dd><dt>调整后</dt><dd>${mode==='edit'?`<input id="m-val" type="number" value="${s.patch[s.editable]}" aria-label="新数值"> ${s.editable==='price'?'元':'间'}`:`<b>${esc(s.after)}</b>`}</dd><dt>原因</dt><dd>${esc(s.reason)}</dd></dl>`;
    if(mode==='edit')body+=s.editable==='price'?`<p class="note">允许范围 ¥${rtOf(s.rt).floor} – ¥${rtOf(s.rt).cap}</p>`:`<p class="note">不能超过选住云管家可售 ${S.inv[s.rt][s.di].pms} 间</p>`;
    if(mode==='reject')body+=`<label class="note" for="m-reason">驳回原因<select id="m-reason">${S.rejectReasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select></label>`;
  }
  if(mode!=='reject')body+=PIN;
  modal(title,body,mode==='reject'?'驳回':mode==='rollback'?'回滚':'确认执行',mode==='reject'?'danger':'primary');
  const first=$(mode==='edit'?'m-val':mode==='reject'?'m-reason':'m-pin');first&&first.focus();
  $('m-ok').onclick=async()=>{
    const err=$('m-err'), btn=$('m-ok');err.textContent='';
    let path, body={};
    if(mode==='rollback'){path=`logs/${l.id}/rollback`;body.password=$('m-pin').value;}
    else if(mode==='reject'){path=`sugs/${s.id}/reject`;body.reason=$('m-reason').value;}
    else{path=`sugs/${s.id}/confirm`;body.password=$('m-pin').value;if(mode==='edit')body.value=Number($('m-val').value);}
    if(mode!=='reject'&&!body.password){err.textContent='请输入您的登录密码。';return;}
    btn.disabled=true;
    try{const d=await api(path,body);closeModal();toast(d.msg);await refresh();}
    catch(e){err.textContent=e.message;btn.disabled=false;}
  };
}

/* ================= 事件 ================= */
let toastT;
function toast(msg){clearTimeout(toastT);let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=msg;t.hidden=false;toastT=setTimeout(()=>{t.hidden=true;},3000);}
function goTab(t){tab=t;try{localStorage.setItem('ota-tab',tab);}catch(err){}render();window.scrollTo(0,0);if(t==='users')loadUsers();}
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){goTab(tb.dataset.tab);return;}
  if(e.target.id==='pwCancel'){startApp();return;}
  if(e.target.id==='pwLogout'){logout();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, id=el.dataset.id, s=S&&S.sugs.find(x=>x.id===id);
  if(a==='m-cancel'){if(e.target===el)closeModal();return;}
  if(a==='confirm'||a==='edit'||a==='reject')openModal(a,s);
  else if(a==='rollback')openModal('rollback',null,S.logs.find(l=>String(l.id)===id));
  else if(a==='ack'||a==='ignore')act(`alerts/${id}/${a}`,{});
  else if(a==='goto-log')goTab('log');
  else if(a==='goto-queue')goTab('queue');
  else if(a==='order')act(`orders/${el.dataset.i}/done`,{});
  else if(a==='rv-draft')act(`reviews/${id}/draft`,{});
  else if(a==='rv-send')act(`reviews/${id}/send`,{text:$('draft-'+id).value});
  else if(a==='save-settings'){
    const thr={autoClose:$('t-autoClose').checked}, rt={};
    document.querySelectorAll('[data-thr]').forEach(i=>{thr[i.dataset.thr]=i.value;});
    document.querySelectorAll('[data-rt]').forEach(i=>{(rt[i.dataset.rt]=rt[i.dataset.rt]||{})[i.dataset.f]=i.value;});
    el.disabled=true;await act('settings',{thr,rt});el.disabled=false;render();
  }
  else if(a==='reset-settings')render();
  else if(a==='u-toggle'){
    const u=U.users.find(x=>String(x.id)===id), dis=el.dataset.dis==='1';
    if(dis&&!confirm(`停用 ${u.name}（${u.username}）？对方会被立即退出，之后无法登录。`))return;
    try{const d=await api(`users/${id}/update`,{disabled:dis});toast(d.msg);}catch(err){toast(err.message);}loadUsers();
  }
  else if(a==='u-reset'){
    const u=U.users.find(x=>String(x.id)===id);
    if(!confirm(`为 ${u.name}（${u.username}）生成新的临时密码？对方当前的登录会被退出。`))return;
    try{const d=await api(`users/${id}/reset`,{});showTemp(d,'密码已重置');}catch(err){toast(err.message);}loadUsers();
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='priceDay'){priceDay=Number(t.value);render();}
  else if(t.dataset.urole){
    try{const d=await api(`users/${t.dataset.urole}/update`,{role:t.value});toast(d.msg);}catch(err){toast(err.message);}loadUsers();
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target, btn=f.querySelector('[type=submit]');
  if(f.id==='loginForm'){
    btn.disabled=true;
    try{const d=await api('login',{username:$('lg-u').value,password:$('lg-p').value});me=d.me;me.mustChange?showAuth('change'):startApp();}
    catch(err){$('lg-err').textContent=err.message;btn.disabled=false;$('lg-p').select();}
  }else if(f.id==='pwForm'){
    const err=$('pw-err');
    if($('pw-n').value!==$('pw-n2').value){err.textContent='两次输入的新密码不一样。';return;}
    btn.disabled=true;
    try{const d=await api('password',{old:$('pw-o').value,new:$('pw-n').value});me=d.me;toast('密码已修改');startApp();}
    catch(x){if(!$('auth').hidden&&$('pw-err')){$('pw-err').textContent=x.message;btn.disabled=false;}}
  }else if(f.id==='addUser'){
    btn.disabled=true;
    try{const d=await api('users',{username:$('nu-u').value.trim(),name:$('nu-n').value.trim(),role:$('nu-r').value});showTemp(d,'账号已创建');}
    catch(x){toast(x.message);}
    btn.disabled=false;loadUsers();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalOpen)closeModal();
  if(e.key==='Enter'&&modalOpen&&(e.target.id==='m-pin'||e.target.id==='m-val')){e.preventDefault();$('m-ok').click();}
});
$('scanBtn').onclick=()=>act('scan',{});
$('pwBtn').onclick=()=>showAuth('change');
$('logoutBtn').onclick=logout;
function clock(){$('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}

clock();setInterval(clock,1000);
setInterval(()=>{if(me&&!me.mustChange&&S&&!document.hidden)refresh(true).catch(()=>{});},10000);
api('me').then(d=>{me=d.me;me.mustChange?showAuth('change'):startApp();}).catch(e=>{if($('auth').hidden)showAuth('login',e.message);});
</script>

</html>
