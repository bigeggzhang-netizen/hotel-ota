<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 酒店 OTA 盯盘系统</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">OTA</div>
    <p class="eyebrow">24 小时盯盘</p>
    <h1>欢迎回来</h1>
    <p class="muted">登录后按你的角色显示工作台与可用操作</p>
    <form id="login-form" class="stack">
      <label>用户名<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">登录工作台</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
    <details id="demo-accounts" class="demo-accounts" hidden>
      <summary>本地演示账户</summary>
    </details>
  </main>
  <script src="/login.js"></script>
</body>
</html>
